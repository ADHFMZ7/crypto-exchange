services:
  db:
    image: postgres:16
    container_name: crypto-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: crypto-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql/migrations:/migrations
    # Built from POSTGRES_* rather than DATABASE_URL: inside the compose network
    # the host must be the `db` service, whereas DATABASE_URL in .env points at
    # localhost for host-side use (psql, `go run ./cmd/main.go`).
    # sslmode=disable is required — golang-migrate uses lib/pq, which demands SSL
    # by default, and the postgres:16 image serves plaintext.
    command: >
      -path=/migrations
      -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      up
    restart: "no"

  api:
    build: .
    container_name: crypto-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Same container-internal URL as migrate. `postgres://` is the one scheme
      # both golang-migrate and pgxpool.ParseConfig accept — pgx5:// breaks pgx.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # Must be 0.0.0.0, not localhost, or the published port is unreachable.
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:

